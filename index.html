<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Safarilink seating arrangements">
  <title>Safarilink Seating Arrangements</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="boarding-card">
    <header class="page-header">
      <div class="legend" aria-label="Seat status legend">
        <span><i class="swatch available"></i>Available</span>
        <span><i class="swatch reserved"></i>Reserved</span>
        <span><i class="swatch selected"></i>Selected</span>
      </div>
      <div class="trip-header">
        <div class="brand-mark" aria-label="Safarilink logo">Safarilink</div>
        <div><h1>Safarilink Seating Arrangements</h1><p>Nairobi <b aria-hidden="true">→</b> BUNGOMA</p><p>04:50 PM <b aria-hidden="true">→</b> 05:35 PM</p></div>
      </div>
    </header>
    <section class="details-panel" aria-labelledby="details-title">
      <div class="step-label">Step 1 of 2</div>
      <h2 id="details-title">Confirm your details</h2>
      <p>Enter your details before choosing a seat.</p>
      <form class="details-form">
        <label>Full name<input name="name" type="text" autocomplete="name" required></label>
        <label>Phone or WhatsApp number<input name="phone" type="tel" autocomplete="tel" required></label>
        <label>Email address<input name="email" type="email" autocomplete="email" required></label>
        <button class="confirm-details" type="submit">Confirm details</button>
        <p class="details-message" role="status" aria-live="polite"></p>
      </form>
    </section>
    <section class="seat-panel locked" aria-labelledby="seat-map-title" aria-disabled="true" hidden>
      <h2 id="seat-map-title" class="sr-only">Choose a seat</h2>
      <button class="cockpit" type="button" aria-label="Cockpit">✈ <span>Cockpit</span></button>
      <div class="seat-map" role="group" aria-label="Available seats">
        <div class="seat-row"><button class="seat available" data-seat="1A"><span>♙</span>1A</button><button class="seat available" data-seat="1B"><span>♙</span>1B</button><span class="row-number">1</span><button class="seat available" data-seat="1C"><span>♙</span>1C</button><button class="seat available" data-seat="1D"><span>♙</span>1D</button></div>
        <div class="seat-row"><button class="seat available" data-seat="2A"><span>♙</span>2A</button><button class="seat available" data-seat="2B"><span>♙</span>2B</button><span class="row-number">2</span><button class="seat available" data-seat="2C"><span>♙</span>2C</button><button class="seat available" data-seat="2D"><span>♙</span>2D</button></div>
        <div class="seat-row"><button class="seat available" data-seat="3A"><span>♙</span>3A</button><button class="seat available" data-seat="3B"><span>♙</span>3B</button><span class="row-number">3</span><button class="seat available" data-seat="3C"><span>♙</span>3C</button><button class="seat available" data-seat="3D"><span>♙</span>3D</button></div>
        <div class="seat-row"><button class="seat available" data-seat="4A"><span>♙</span>4A</button><button class="seat reserved" data-seat="4B" disabled><span>♙</span>4B</button><span class="row-number">4</span><button class="seat available" data-seat="4C"><span>♙</span>4C</button><button class="seat available" data-seat="4D"><span>♙</span>4D</button></div>
        <div class="seat-row"><button class="seat available" data-seat="5A"><span>♙</span>5A</button><button class="seat available" data-seat="5B"><span>♙</span>5B</button><span class="row-number">5</span><button class="seat reserved" data-seat="5C" disabled><span>♙</span>5C</button><button class="seat available" data-seat="5D"><span>♙</span>5D</button></div>
        <div class="seat-row"><button class="seat available" data-seat="6A"><span>♙</span>6A</button><button class="seat reserved" data-seat="6B" disabled><span>♙</span>6B</button><span class="row-number">6</span><button class="seat available" data-seat="6C"><span>♙</span>6C</button><button class="seat available" data-seat="6D"><span>♙</span>6D</button></div>
        <div class="seat-row"><button class="seat reserved" data-seat="7A" disabled><span>♙</span>7A</button><button class="seat available" data-seat="7B"><span>♙</span>7B</button><span class="row-number">7</span><button class="seat available" data-seat="7C"><span>♙</span>7C</button><button class="seat available" data-seat="7D"><span>♙</span>7D</button></div>
        <div class="seat-row"><button class="seat available" data-seat="8A"><span>♙</span>8A</button><button class="seat available" data-seat="8B"><span>♙</span>8B</button><span class="row-number">8</span><button class="seat available" data-seat="8C"><span>♙</span>8C</button><button class="seat reserved" data-seat="8D" disabled><span>♙</span>8D</button></div>
      </div>
      <p class="selection-message" role="status" aria-live="polite">Select an available seat to continue.</p>
      <a class="whatsapp-button" href="#" hidden>WhatsApp booking</a>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
